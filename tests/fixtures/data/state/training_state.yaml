# Synthetic baseline state used by the test suite.
#
# This is NOT the athlete's real training state: the live state lives in Google
# Drive. Tests assert against the fixed programme positions below (see
# tests/test_state_manager.py), so this file is a committed fixture, not data.
version: 1
training_preferences:
  desired_sessions_per_week:
    lifting: 3
    rowing: 3
  fixed_weekdays: false
  double_sessions_preferred: false
programmes:
  jnt_2:
    active: true
    modality: lifting
    history_file: history/strong/strong_history.csv
    reference: programmes/J&T 2.0/reference.md
    generated_folder: generated/strong
  pete_plan_beginner:
    active: true
    modality: rowing
    history_file: history/concept2/concept2_history.csv
    reference: programmes/Beginner Pete Plan/reference.md
    latest_confirmed_workout:
      id: '2026-09-25:15:00 row'
      date: '2026-09-25'
      label: 15:00 row
      programme_position:
        week: 8
        session: optional_day_4
        description: 25min steady row
adaptation_policy:
  allow_load_adjustment: true
  max_load_change_percent: 10.0
  allow_rep_adjustment: true
  allow_volume_adjustment: true
  max_volume_change_percent: 25.0
  allow_rest_adjustment: true
  allow_exercise_substitution: true
memory:
  preferences:
    - User prefers flexible training days rather than fixed weekdays.
    - User prefers explicit targets for rowing.
