# Programme registry. Adding a programme = adding a reference document in
# Drive plus an entry here. No core code changes required (spec section 11/42).

programmes:
  - id: jnt_2
    name: "J&T 2.0"
    modality: lifting
    reference: "programmes/J&T 2.0/reference.md"
    # Upload landing spot for a completed Strong CSV. Not kept as history:
    # `summarise_session` condenses it into sessions/*.yaml, which is the
    # lifting history, and the Strong format comes from the day templates below.
    history_file: "history/strong/strong_history.csv"
    generated_folder: "generated/strong"
    # One fill-in template per session day (day_1.csv .. day_4.csv): the day's
    # exercise/set structure as a pure Strong CSV skeleton with weights and reps
    # left blank. The LLM fills them in from the reference and recent history.
    templates_folder: "programmes/J&T 2.0/templates"

  - id: pete_plan_beginner
    name: "Beginner Pete Plan"
    modality: rowing
    reference: "programmes/Beginner Pete Plan/reference.md"
    history_file: "history/concept2/concept2_history.csv"
    generated_folder: null
