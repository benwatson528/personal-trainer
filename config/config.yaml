# Personal Trainer configuration.
#
# This file stays local: it is what tells the app where everything else lives,
# and it contains no secrets. Content-config (programmes.yaml, equipment.yaml)
# and all training data live in the storage root; secrets live in secrets/.

storage:
  # "local" for filesystem-backed development, "gdrive" for Google Drive.
  backend: gdrive
  # Root mirror used only by the local backend / migration scripts.
  root: ./data
  # Name of the environment variable that provides the Drive root folder id.
  root_folder_id_env: GDRIVE_ROOT_FOLDER_ID
  # OAuth token written once by `scripts/gdrive_auth.py` (you; files are yours).
  oauth_token_file: secrets/gdrive_token.json
  # Service-account key (Workspace shared drives only). Unused here.
  credentials_file: null

llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  # Replaceable without changing PT architecture.
  model: anthropic/claude-haiku-4.5
  # Name of the environment variable that provides the LLM API key.
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.4
  max_tokens: 4096
  # USD per million tokens — used only for cost logging in pt.log.
  price_in: 1.00        # anthropic/claude-haiku-4.5
  price_out: 5.00

strong_generation:
  max_validation_retries: 3
  # Condensed session records (written by the LLM after each workout) shown as
  # the athlete's training history.
  history_sample_sessions: 20

folders:
  programmes: programmes
  # Condensed per-session lifting history, extracted by the LLM after each
  # workout. Our own format, so Python may read it; the raw app export is never
  # parsed.
  sessions: sessions
  # Training state file (per-workout mutable state: active, confirmed/pending workouts, hashes)
  state: config/training_state.yaml
  generated_strong: generated/strong
  # Content-config, read from the storage root (Drive) at startup.
  programmes_config: config/programmes.yaml
  equipment_config: config/equipment.yaml

# Where completed workouts are uploaded (per-programme; see config/programmes.yaml).
# The app reads the newest file from this folder to summarise the session.
# completed_workouts_folder: uploads/strong
