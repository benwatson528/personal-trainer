# Equipment you actually own.
#
# The agent uses this to pick loadable weights. It must never prescribe a
# dumbbell you don't have, or a barbell load you can't plate up. Edit this
# file when you add or lose kit — no code changes needed.
#
# All weights are in kg.

# --- Bars -------------------------------------------------------------------
# Bare bar weight. Key is whatever you call it; "barbell" and "ez_bar" are
# just the defaults.
bars:
  barbell: 20
  ez_bar: 8

# --- Plates -----------------------------------------------------------------
# The plate sizes you have. Each entry is one plate; `count` is how many of
# that size you own (normally an even number, since you load matched pairs).
# A barbell working weight must be reachable as:
#     bar weight + (sum of chosen plates) x 2
plates:
  - {weight: 25, count: 2}
  - {weight: 20, count: 6}
  - {weight: 15, count: 2}
  - {weight: 10, count: 4}
  - {weight: 5, count: 4}
  - {weight: 2.5, count: 4}
  - {weight: 1.25, count: 4}
  - {weight: 0.5, count: 2}

# --- Dumbbells --------------------------------------------------------------
# The weight of a SINGLE dumbbell, heaviest first. Only use weights listed
# here. If you own adjustable dumbbells, list every increment you can set
# them to.
dumbbells:
  - 40
  - 37
  - 33.5
  - 30.5
  - 27.5
  - 25
  - 24
  - 22.5
  - 21
  - 20
  - 18
  - 17.5
  - 15
  - 14.5
  - 12.5
  - 11.5
  - 10
  - 8
  - 7.5
  - 5
  - 2.5

# --- Free weights -----------------------------------------------------------
# Optional: kettlebells, weight benches, machines, bands, cardio machines.
# Anything the agent should know it can program with. Free-form so you can
# write notes.
other:
  - "Adjustable bench, flat and incline"
  - "Squat rack"
  - "Pull-up bar (inward, wide and narrow grips)"
  - "Dip belt"
  - "Tibia bar"
  - "Push-up handles"
  - "Dip arms"
  - "Concept2 rower"
  - "Resistance bands"
  - "Landmine barbell attachment"